name: AllyO
description: 'AllyO is an HR-tech company, founded in 2016 in Palo Alto, California, that built a
  conversation-first, AI recruiting chatbot and automation platform for high-volume hiring. Its
  chatbot let candidates apply to jobs, answer common questions, get screened, and schedule
  interviews via text and web chat 24/7, with integrations into applicant tracking systems, job
  boards, and background-check providers. AllyO raised roughly $64M in venture funding (including a
  $45M round in 2019 backed by investors such as Sapphire Ventures) before being acquired by HireVue
  in October 2020. The AllyO product now lives inside HireVue as its Conversational AI and Automation
  offering; www.allyo.com 301-redirects to HireVue and AllyO no longer operates an independent public
  developer or API surface. This profile is retained as an acquired-company record in the API
  Evangelist network.'
